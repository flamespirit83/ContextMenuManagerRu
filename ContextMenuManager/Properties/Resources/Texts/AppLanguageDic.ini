AboutApp = [Compatibility]\r\n 1 = Compatible with Win10, 8.1, 8, 7, Vista\r\n 2 = Compatible with 64-bit and 32-bit operating systems\r\n 3 = Supports high DPI displays; optimal scaling is 150%\r\n\r\n[Open Source]\r\n 1 = Language: C#, WinForms, MIT license\r\n 2 = Github Repository: https://github.com/BluePointLilac/ContextMenuManager \r\n 3 = Gitee Repository: https://gitee.com/BluePointLilac/ContextMenuManager \r\n\r\n[Important Notes]\r\n 1 = This program performs numerous read, write, and delete operations on registry keys and files. These actions are sensitive and may be\r\n mistakenly flagged as a virus by Windows Defender or other antivirus software. If this occurs, please add the program to the whitelist.\r\n\r\n 2 = Some special menu items may not appear directly in the context menu due to other factors.\r\n However, based on the general rules used by this program, they will still appear as enabled. This is normal.\r\n\r\n 3 = Different context menu managers may use different methods to disable menus. It is recommended not to use multiple context menu managers simultaneously.\r\n Most programs use a simple backup-and-delete method. This program attempts to use system-provided keys for hiding.\r\n For menu items disabled by other programs, please restore them using that program first; otherwise, they may not appear in this program.\r\n\r\n 4 = This program is not designed to clean up leftover items from uninstalled programs, but it can help you locate the registry and file paths related to menu items.\r\n You can take action based on the information provided. If you are a novice user, it is recommended to only use the enable/disable switches.

Dictionaries = [Dictionary Description]\r\n This program has several dictionary files. Each dictionary has a user dictionary (User directory) and a web dictionary (Web directory).\r\n To add a dictionary to this program, save the file to the User directory via the right-click menu and follow the instructions inside the file.\r\n You can also send your dictionary to my email or submit a merge request on Github to contribute to this project.\n The right tab contains the original dictionary content. You can switch tabs to view, right-click to edit, or save it.\r\n\r\n[Dictionary Content]\r\n 1 = Program display text language dictionary (Languages directory)\r\n 2 = ShellEx menu item GUID text and icon dictionary (GuidInfosDic.ini)\r\n 3 = Detailed settings dictionary for system and other program internal menus (DetailedEditDic.xml)\r\n 4 = Enhanced menu items dictionary (EnhanceMenusDic.xml)\r\n 5 = UWP module items dictionary (UWPModeItemsDic.xml)

Donate = This program is completely free. If you find it useful, you can support the author by scanning\r\nthe QR code below (WeChat, Alipay, Tencent QQ). Any amount is appreciated. Thank you for your support!\r\nAlso, please consider starring this project on Github or Gitee (it means a lot to me!).
