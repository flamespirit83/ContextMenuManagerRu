;This file is the display text dictionary for ContextMenuManager.
;It helps translators provide translations and submit them to Github. Replace the content to the right of the equal sign with the translated text.
;General - Translator is the translation contributor, General - Language is the language name, e.g., en-US for American English,
;General - TranslatorUrl is the URL of the translation contributor (any URL that can be opened with the Win+R command is acceptable)
;Translation notes: Leave values blank if not translated temporarily. Use \r\n or \n for line breaks in dictionary values.
;For multiple translation contributors, use \r\n or \n to separate Translator values and their corresponding TranslatorUrl values.
;If a contributor has no URL, assign null, ensuring contributors and links correspond one-to-one. Example: Translator = Bob \r\n Join \r\n Andi, 
;TranslatorUrl = https://github.com/BluePointLilac \r\n null \r\n https://gitee.com/BluePointLilac

